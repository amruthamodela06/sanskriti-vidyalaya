databases:
  - name: sanskriti-db
    plan: starter  # $7/month - persistent database

services:
  - type: web
    name: sanskriti-vidyalaya
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sanskriti-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
